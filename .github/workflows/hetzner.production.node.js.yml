# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Hetzner Production node.js

on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build-app:
    runs-on: [ self-hosted, production ]
    strategy:
      matrix:
        node-version: [ 16.x ]
    steps:
      - uses: actions/checkout@v2
      - name: Update secrets
        run: 'echo "$PRODUCTION_ENV" > .production.env'
        env:
          PRODUCTION_ENV: ${{secrets.PRODUCTION_ENV}}
      - name: 'Build app container'
        run: |
          set -a 
          . .production.env 
          set +a
          docker compose --env-file=.production.env -f docker-compose.prod.yml -p zg-frontend build app
        env:
          VERSION: ${{ github.ref_name }}
          RUNNING_USER: ${{ secrets.HETZNER_RUNNING_USER }}
      - name: 'Push API container to local registry'
        run: docker compose --env-file=.production.env -f docker-compose.prod.yml -p zg-frontend push app
        env:
          VERSION: ${{ github.ref_name }}
          RUNNING_USER: ${{ secrets.HETZNER_RUNNING_USER }}

  deploy:
    runs-on: self-hosted
    needs:
      - build-app
    steps:
      - name: Update secrets
        run: 'echo "$PRODUCTION_ENV" > .production.env'
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
      - name: Deploy to swarm
        run: |
          set -a 
          . .production.env 
          set +a
          docker stack deploy -c docker-compose.prod.yml --with-registry-auth zg-frontend
        env:
          VERSION: ${{ github.ref_name }}
          RUNNING_USER: ${{ secrets.HETZNER_RUNNING_USER }}
